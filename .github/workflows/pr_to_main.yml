name: Build and Test
on:
  push: # also execute the tests on any push as an extra check
  pull_request:
    branches: [ main ]

# to stop GitHub Actions from cluttering if there are lots of pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # build matrix to check both Debug and Release builds
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug + Address-Sanitizer and Undefined Behavior-Sanitizer
            build_type: Debug
            cxx_flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          - name: Release + Werror
            build_type: Release
            cxx_flags: "-Werror"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build (${{ matrix.name }})
        run: |
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DENABLE_VTK_OUTPUT=OFF \
            -DBUILD_DOC_DOXYGEN=OFF
          cmake --build build -j
      - name: Execute the tests
        run: ctest --test-dir build --output-on-failure
