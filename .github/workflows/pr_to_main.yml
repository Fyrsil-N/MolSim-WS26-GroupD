name: Build and Test
on:
  push:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build the project
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_VTK_OUTPUT=OFF -DBUILD_DOC_DOXYGEN=OFF
          cmake --build build -j
      - name: Execute the tests
        run: ctest --test-dir build --output-on-failure
