simulation:
  delta_t: 0.00005
  end_t: 10
  out_interval: 200
  3d: false
  domain:
    anchor_point: [ 0, 0, 0 ]
    dimensions: [ 120, 50, 1 ]
    boundaries:
      x: [ reflecting, reflecting ]
      y: [ reflecting, reflecting ]
  pair_force:
    Lennard-Jones:
      sigma: 1
      epsilon: 5
      cutoff: 3.0

scene:
  ellipsoids:
    - anchor_point: [ 60, 25, 0 ]
      dimensions: [ 15, 15, 1 ]
      velocity: [ 0, -10, 0 ]
      spacing: 1.1225
      mass: 1.0
      type: 0
