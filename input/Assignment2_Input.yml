simulation:
  delta_t: 0.0002
  end_t: 5
  out_interval: 50
  basename: MD_Assignment2
  3d: false
  # required by the format, but unused here: without a cutoff the direct sum is used (as on sheet 2)
  domain:
    anchor_point: [ -20, -20, 0 ]
    dimensions: [ 100, 80, 1 ]
    boundaries:
      x: [ outflow, outflow ]
      y: [ outflow, outflow ]
  pair_force:
    Lennard-Jones:
      sigma: 1
      epsilon: 5

scene:
  cuboids:
    - anchor_point: [ 0, 0, 0 ]
      dimensions: [ 40, 8, 1 ]
      velocity: [ 0, 0, 0 ]
      spacing: 1.1225
      mass: 1
      type: 0

    - anchor_point: [ 15, 15, 0 ]
      dimensions: [ 8, 8, 1 ]
      velocity: [ 0, -10, 0 ]
      spacing: 1.1225
      mass: 1
      type: 1
