simulation:
  delta_t: 0.0005
  end_t: 20
  out_interval: 50
  basename: MD_Assignment3_Collision
  3d: false
  domain:
    anchor_point: [ 0, 0, 0 ]
    dimensions: [ 180, 90, 1 ]
    boundaries:
      x: [ outflow, outflow ]
      y: [ outflow, outflow ]
  pair_force:
    Lennard-Jones:
      sigma: 1
      epsilon: 5
      cutoff: 3.0

scene:
  cuboids:
    - anchor_point: [ 20, 20, 0 ]
      dimensions: [ 100, 20, 1 ]
      velocity: [ 0, 0, 0 ]
      spacing: 1.1225
      mass: 1
      type: 0

    - anchor_point: [ 70, 60, 0 ]
      dimensions: [ 20, 20, 1 ]
      velocity: [ 0, -10, 0 ]
      spacing: 1.1225
      mass: 1
      type: 1
